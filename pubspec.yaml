name: portfolio
description: "portfolio app"

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  go_router: ^18.0.2
  url_launcher: ^6.3.3
  intl: ^0.20.3
  flutter_inset_shadow: ^2.0.3
  supabase_flutter: ^2.12.0
  flutter_svg: ^2.3.0
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_gen_runner: ^5.12.0
  json_serializable: ^6.11.2
  flutter_lints: ^6.0.0
  go_router_builder: ^4.5.0
  build_runner: ^2.16.1
  intl_utils: ^2.8.10

flutter:
  generate: true
  uses-material-design: true

  # Assets
  assets:
    - assets/svgs/phone.svg
    - .env

flutter_gen:
  output: lib/generated/
  line_length: 80

  integrations:
    flutter_svg: true

flutter_intl:
  enabled: true